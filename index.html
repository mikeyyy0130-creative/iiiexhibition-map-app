<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#18213a" />
    <meta name="description" content="東京大学制作展の会場マップ。現在地から会場までの道順と、工学部2号館の中の会場の場所を案内します。" />
    <title>会場マップ</title>
    <link rel="icon" href="images/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- フォントは表示を止めないよう後から読み込む(読めなくても端末の標準フォントで表示) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1 id="title" class="title"></h1>
        <p id="period" class="period"></p>
      </div>
      <button id="info-btn" class="icon-btn icon-btn-on-dark" type="button" aria-label="展示の情報" data-icon="info"></button>
    </header>

    <main id="map-area">
      <div id="map" role="region" aria-label="会場の地図"></div>
      <div class="map-top">
        <div class="mode" role="group" aria-label="地図に表示するもの">
          <button type="button" data-mode-btn="exhibit" aria-pressed="true">展示</button>
          <button type="button" data-mode-btn="detour" aria-pressed="false">寄り道</button>
        </div>
      </div>
      <div class="map-fabs">
        <button id="fit" class="fab" type="button" aria-label="全体を表示" data-icon="fit"></button>
        <button id="locate" class="fab fab-locate" type="button" aria-label="現在地を表示" data-icon="locate"></button>
      </div>
    </main>

    <section id="sheet" class="sheet" aria-label="会場一覧">
      <button class="sheet-grip" type="button" aria-label="パネルを大きくする"><span></span></button>
      <div class="sheet-head"></div>
      <div class="sheet-body"></div>
    </section>

    <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-title" hidden>
      <button id="overlay-close" class="icon-btn overlay-close" type="button" aria-label="閉じる" data-icon="close"></button>
      <div id="overlay-body"></div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <div id="check"></div>
    <div id="fatal" class="fatal" hidden></div>
    <noscript><p class="fatal">このページを見るには JavaScript を有効にしてください。</p></noscript>

    <script src="vendor/leaflet/leaflet.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
